name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install verified BVM and selected Bun
        run: |
          curl -fsSL https://raw.githubusercontent.com/absolutejs/bvm/1ed34a5dc634c9812ab9d5c8c17081868d4bd9a8/install.sh -o "$RUNNER_TEMP/install-bvm.sh"
          sh "$RUNNER_TEMP/install-bvm.sh"
          echo "$HOME/.bvm/bin" >> "$GITHUB_PATH"
      - run: bun --version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:package
      - run: node scripts/check-consumer.mjs
      - run: bun pm pack --ignore-scripts --filename geometry.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package
          path: geometry.tgz
